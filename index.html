<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woodway Content Timeline</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: Lumix ramp-up Gantt. Label column left, six-month lane right, hatched holiday break, "needs from Woodway" card in the empty top right. */
  --paper: #ffffff;
  --panel: #f8f8f6;
  --ink: #0b1f2d;
  --muted: #5b5a57;
  --line: #e1e0d9;
  --faint: #efeee9;
  --navy: #103f57;
  --wine: #870632;
  --forest: #204b2c;
  --sky: #afcfff;
  --magenta: #c8329a;
  --font: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --label: clamp(150px, 22cqw, 272px);
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { background: var(--paper); }

body {
  font-family: var(--font);
  color: var(--ink);
  padding: 40px 32px 48px 40px;
  -webkit-font-smoothing: antialiased;
}

/* Lumix edge strip */
body::before {
  content: "";
  position: fixed;
  top: 0; bottom: 0; left: 0;
  width: 8px;
  background: linear-gradient(to bottom, #fff56a 0%, var(--sky) 34%, var(--navy) 66%, var(--magenta) 100%);
}

.wrap { max-width: 1440px; margin: 0 auto; }

h1 {
  font-size: clamp(30px, 4.2vw, 52px);
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -0.015em;
  color: var(--navy);
  text-wrap: balance;
}

.sub { margin-top: 14px; font-size: 17px; font-weight: 600; }

.scroll { margin-top: 28px; container-type: inline-size; }

.gantt {
  position: relative;
  border: 1px solid var(--line);
  background: var(--paper);
}

/* Header */
.head {
  display: grid;
  grid-template-columns: var(--label) 1fr;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.head-label { border-right: 1px solid var(--line); }
.months { display: flex; }
.month {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding: 9px 0 7px;
  border-right: 1px solid var(--line);
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
}
.month:last-child { border-right: 0; }
.mnum { font-size: 10.5px; font-weight: 500; color: var(--muted); }
.ticks {
  position: relative;
  height: 24px;
  border-top: 1px solid var(--faint);
  overflow: hidden;
}
.tick {
  position: absolute;
  top: 5px;
  transform: translateX(-50%);
  font-size: 10px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* Body */
.body { position: relative; }

.row {
  display: flex;
  min-height: 54px;
  border-bottom: 1px solid var(--faint);
}
.row:last-child { border-bottom: 0; }
.cell {
  flex: 0 0 var(--label);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: 9px 16px;
  border-right: 1px solid var(--line);
}
.lane { position: relative; flex: 1; }

.tn {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.25;
  text-align: left;
  color: inherit;
  cursor: pointer;
}
.tn:focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; border-radius: 2px; }
.chev {
  flex: 0 0 auto;
  width: 6px;
  height: 6px;
  margin-top: 5px;
  border-right: 1.5px solid var(--muted);
  border-bottom: 1.5px solid var(--muted);
  transform: rotate(-45deg);
  transition: transform 0.15s ease;
}
.tn[aria-expanded="true"] .chev { transform: rotate(45deg); }
.ts { padding-left: 14px; font-size: 11.5px; line-height: 1.3; color: var(--muted); }
.ts[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }

.row.phase {
  min-height: 44px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.row.phase .cell { flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; }
.sw { width: 10px; height: 10px; border-radius: 2px; background: var(--c); border: 1px solid rgba(0, 0, 0, 0.15); }
.ph { font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; }
.pm { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--muted); }

.build   { --c: var(--navy);   --on: #ffffff; }
.execute { --c: var(--wine);   --on: #ffffff; }
.review  { --c: var(--forest); --on: #ffffff; }
.measure { --c: var(--sky);    --on: var(--ink); }

/* Bars */
.bar {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  height: 26px;
  border-radius: 4px;
  border: 1px solid rgba(0, 0, 0, 0.15);
  background: var(--c);
  z-index: 2;
}
.bdate {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  white-space: nowrap;
  font-size: 11.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.bar.right .bdate, .bar.left .bdate {
  padding: 1px 4px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.88);
}
.bar.right .bdate { left: calc(100% + 4px); }
.bar.left .bdate { right: calc(100% + 4px); }
.bar.in .bdate { right: 10px; color: var(--on); font-weight: 500; }

/* Overlay: gridlines, holiday hatch, client card */
.overlay {
  position: absolute;
  top: 0; bottom: 0;
  left: var(--label);
  right: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}
.gl { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--faint); }
.mshort { display: none; }

/* Responsive: the chart reacts to its own width, so it holds up in a narrow window, a side panel or a resized slide. */
@container (max-width: 900px) {
  .mfull { display: none; }
  .mshort { display: inline; }
  .tick:not(.t2) { display: none; }
  .bdate { font-size: 10.5px; }
  .pm { display: none; }
}

/* Narrow: each task stacks its name above a full-width lane. */
@container (max-width: 620px) {
  .head { grid-template-columns: 1fr; }
  .head-label { display: none; }
  .overlay { left: 0; }
  .mnum { display: none; }
  .pm { display: inline; }
  .tick:not(.t4) { display: none; }
  .row:not(.phase) { flex-direction: column; min-height: 0; }
  .row:not(.phase) .cell { flex: none; border-right: 0; padding: 10px 12px 0; }
  .row:not(.phase) .lane { flex: none; height: 38px; }
  .row.phase .cell { flex: 1; border-right: 0; }
  .row.phase .lane { display: none; }
}

@media (max-width: 640px) {
  body { padding: 24px 16px 32px 22px; }
}
</style>
</head>
<body>
<main class="wrap">
  <h1>6-Month Content and Positioning Plan</h1>
  <p class="sub">Woodway Energy, December 2026 to May 2027</p>
  <div class="scroll">
    <div class="gantt" id="chart" aria-label="Woodway six-month content and positioning timeline"></div>
  </div>
</main>

<script>
(function () {
  var DAY = 86400000;
  var START = Date.UTC(2026, 11, 1);   // Dec 1, 2026
  var END = Date.UTC(2027, 5, 1);      // Jun 1, 2027 (exclusive)
  var TOTAL = (END - START) / DAY;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var FULL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

  function D(y, m, d) { return Date.UTC(y, m - 1, d); }
  function pct(t) { return (t - START) / DAY / TOTAL * 100; }
  function span(s, e) { return ((e - s) / DAY + 1) / TOTAL * 100; }
  function fmt(t) { var x = new Date(t); return MON[x.getUTCMonth()] + " " + x.getUTCDate(); }

  var plan = [
    { phase: "Build", note: "Month 1", cls: "build", rows: [
      { name: "SEO and AI search foundation", sub: "Position tracking, Google and ChatGPT business profiles", s: D(2026, 12, 1), e: D(2026, 12, 11) },
      { name: "Audit existing content", sub: "Tag each piece to its market", s: D(2026, 12, 1), e: D(2026, 12, 11) },
      { name: "Content calendar", sub: "Insights, case studies, project pages", s: D(2026, 12, 8), e: D(2026, 12, 18) },
      { name: "Draft four market pages", sub: "Data centers is the first rank target", s: D(2026, 12, 7), e: D(2026, 12, 18) }
    ]},
    { phase: "Execute", note: "Months 2 to 5", cls: "execute", rows: [
      { name: "Woodway review of market pages", sub: "Feedback and revisions", s: D(2027, 1, 4), e: D(2027, 1, 15) },
      { name: "Publish four market pages", sub: "Link to existing insight content", s: D(2027, 1, 18), e: D(2027, 1, 29) },
      { name: "Insights, case studies, updates", sub: "Each article links to its market page", s: D(2027, 1, 4), e: D(2027, 4, 30) },
      { name: "LinkedIn posts", sub: "2 to 3 per week: insights, milestones, project updates", s: D(2027, 1, 4), e: D(2027, 4, 30) }
    ]},
    { phase: "Review", note: "Month 6", cls: "review", rows: [
      { name: "Review results", sub: "Search position, traffic, LinkedIn", s: D(2027, 5, 3), e: D(2027, 5, 14) },
      { name: "Refresh market pages", sub: "Apply what we learned", s: D(2027, 5, 17), e: D(2027, 5, 28) }
    ]},
    { phase: "Measure", note: "Ongoing", cls: "measure", rows: [
      { name: "Performance tracking", sub: "Search position, website traffic, LinkedIn", s: D(2026, 12, 7), e: D(2027, 5, 28) }
    ]}
  ];

  // Month header
  var months = "";
  for (var i = 0; i < 6; i++) {
    var first = Date.UTC(2026, 11 + i, 1);
    var next = Date.UTC(2026, 12 + i, 1);
    var fd = new Date(first);
    months += '<div class="month" style="flex:0 0 ' + ((next - first) / DAY / TOTAL * 100).toFixed(3) + '%">' +
      '<span class="mfull">' + FULL[fd.getUTCMonth()] + " " + fd.getUTCFullYear() + "</span>" +
      '<span class="mshort">' + MON[fd.getUTCMonth()] + "</span>" +
      '<span class="mnum">Month ' + (i + 1) + "</span></div>";
  }

  // Monday ticks and gridlines
  var ticks = "", grid = "";
  var t = START;
  while (new Date(t).getUTCDay() !== 1) t += DAY;
  for (var ti = 0; t < END; t += 7 * DAY, ti++) {
    var p = pct(t);
    grid += '<div class="gl" style="left:' + p.toFixed(3) + '%"></div>';
    if (p < 97.5) ticks += '<span class="tick' + (ti % 2 === 0 ? " t2" : "") + (ti % 4 === 0 ? " t4" : "") +
      '" style="left:' + p.toFixed(3) + '%">' + new Date(t).getUTCDate() + "</span>";
  }

  // Rows
  var rows = "";
  plan.forEach(function (ph) {
    rows += '<div class="row phase ' + ph.cls + '"><div class="cell"><span class="sw"></span><span class="ph">' + ph.phase +
      '</span><span class="pm">' + ph.note + '</span></div><div class="lane"></div></div>';
    ph.rows.forEach(function (r) {
      var w = span(r.s, r.e);
      var endPct = pct(r.e) + 100 / TOTAL;
      var mode = w > 30 ? "in" : (endPct > 78 ? "left" : "right");
      var label = fmt(r.s) + " - " + fmt(r.e);
      rows += '<div class="row ' + ph.cls + '"><div class="cell"><button type="button" class="tn" aria-expanded="false"><span class="chev" aria-hidden="true"></span><span>' + r.name + '</span></button><span class="ts" hidden>' + r.sub +
        '</span></div><div class="lane"><div class="bar ' + mode + '" role="img" aria-label="' + r.name + ", " + label +
        '" style="left:' + pct(r.s).toFixed(3) + "%;width:" + w.toFixed(3) + '%"><span class="bdate">' + label + "</span></div></div></div>";
    });
  });

  document.getElementById("chart").innerHTML =
    '<div class="head"><div class="head-label"></div><div><div class="months">' + months + '</div><div class="ticks">' + ticks + "</div></div></div>" +
    '<div class="body"><div class="overlay">' + grid + "</div>" + rows + "</div>";

  // Descriptions start collapsed; a click on the task name toggles its description.
  document.getElementById("chart").addEventListener("click", function (ev) {
    var btn = ev.target.closest(".tn");
    if (!btn) return;
    var open = btn.getAttribute("aria-expanded") === "true";
    btn.setAttribute("aria-expanded", open ? "false" : "true");
    btn.nextElementSibling.hidden = open;
  });
})();
</script>
</body>
</html>
